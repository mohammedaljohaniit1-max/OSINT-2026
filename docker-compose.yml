# Universal fallback: run Argus + SearXNG + Tor in containers.
#   docker compose up -d
#   docker compose exec argus argus scan example.com
services:
  searxng:
    image: searxng/searxng:latest
    container_name: argus-searxng
    ports: ["8888:8080"]
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=argus
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped

  tor:
    image: dperson/torproxy:latest
    container_name: argus-tor
    ports: ["9050:9050"]
    restart: unless-stopped

  argus:
    build: .
    container_name: argus
    depends_on: [searxng, tor]
    environment:
      - ARGUS_SEARXNG=http://searxng:8080
    volumes:
      - ./reports:/app/reports
    stdin_open: true
    tty: true
